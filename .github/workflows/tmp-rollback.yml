# ВРЕМЕННЫЙ сценарий проверки: возврат к предыдущему составу по его тегу.
# Живёт только в ветке проверки, в main не сливается и удаляется вместе с ней.
name: tmp-rollback

on:
  pull_request:

env:
  IMAGE: ghcr.io/united-software-platform/sdd-developer-kit

jobs:
  rollback:
    name: Возврат к предыдущему составу
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Тег состава прошлой публикации обязан и дальше отдавать тот же образ, что тогда,
      # независимо от того, что помечено latest.
      - name: Сверка тега состава с latest
        env:
          # Первая публикация новым пайплайном — состав набора 1.4.1
          OLD_TAG: 1.4.1-20260925-205732
        run: |
          label() { docker image inspect "$IMAGE:$1" --format "{{index .Config.Labels \"$2\"}}"; }

          for tag in "$OLD_TAG" latest; do
              echo "== $tag =="
              docker pull --quiet "$IMAGE:$tag" >/dev/null
              echo "версия набора: $(label "$tag" org.opencontainers.image.version)"
              echo "базовый образ: $(label "$tag" org.opencontainers.image.base.name)"
              echo "digest основы: $(label "$tag" org.opencontainers.image.base.digest)"
              echo "утилита:       $(label "$tag" io.sdd-kit.openspec.version)"
              echo "claude в контейнере: $(docker run --rm "$IMAGE:$tag" claude --version)"
          done

          old_kit=$(label "$OLD_TAG" org.opencontainers.image.version)
          new_kit=$(label latest org.opencontainers.image.version)
          [ "$old_kit" != "$new_kit" ] \
              || { echo "оба тега отдают набор одной версии — проверка не показательна" >&2; exit 1; }
          echo "тег состава $OLD_TAG отдаёт набор $old_kit, latest — $new_kit"
