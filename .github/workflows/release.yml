# Релиз версии репозитория SDD Developer Kit.
#
# Запускается только вручную: релиз — решение человека, а не следствие события репозитория.
# Ручной запуск с явно заданными разрядом и задачей и есть то явное решение, которого требует
# GIT-015; отдельных подтверждений внутри прогона поэтому нет.
#
# Один прогон делает всё разом: поднимает VERSION, коммитит, ставит аннотированный тег vX.Y.Z
# и публикует его. Отсюда согласованность носителей по построению — состояния, в котором тег
# указывает на коммит с другим номером, не возникает, и сторожить его проверкой не нужно.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Разряд версии
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      task:
        description: Код и номер задачи для сообщения коммита, например SDDT-012
        required: true
        type: string

# Право на запись нужно ровно этому сценарию: он коммитит VERSION и публикует тег.
permissions:
  contents: write

jobs:
  release:
    name: Повышение версии и публикация тега
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4

      # Заголовок сообщения коммита обязан удовлетворять GIT-009, а выводить номер задачи
      # из контекста запрещает GIT-010 — отсюда обязательный входной параметр и его проверка.
      #
      # Входные значения передаются через env, а не подставляются в текст команды: подстановка
      # выражения ${{ }} прямо в скрипт склеивает данные с кодом, и ввод запускающего оказался бы
      # исполняемым.
      - name: Проверка кода задачи
        env:
          TASK: ${{ inputs.task }}
        run: |
          printf '%s\n' "$TASK" | grep -Eq '^[A-Z]{2,10}-[0-9]{3}$' || {
              echo "Код задачи не соответствует GIT-009: $TASK" >&2
              echo "Ожидается вид SDDT-012 — код заглавными латинскими и три цифры." >&2
              exit 1
          }

      # Значение читается строго как МАЖОР.МИНОР.ПАТЧ: молчаливое додумывание неполного номера
      # дало бы тег, не совпадающий с содержимым файла.
      - name: Разбор текущей версии
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(head -n 1 VERSION | tr -d ' \011\015\012')
          printf '%s\n' "$current" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "VERSION не разбирается как МАЖОР.МИНОР.ПАТЧ: прочитано «$current»" >&2; exit 1; }
          major=${current%%.*}; rest=${current#*.}; minor=${rest%%.*}; patch=${rest#*.}
          case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "$current -> $major.$minor.$patch"

      # Гейт GIT-020: новая версия не пишется поверх незафиксированной работы.
      - name: Гейт незакоммиченных правок
        run: |
          pending=$(git status --porcelain -- VERSION)
          [ -z "$pending" ] || { echo "В VERSION есть незакоммиченные правки:" >&2
                                 echo "$pending" >&2; exit 1; }

      - name: Запись версии, коммит и тег
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
          TASK: ${{ inputs.task }}
        run: |
          printf '%s\n' "$NEXT" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "$TASK: релиз v$NEXT" -m "Версия повышена: $CURRENT -> $NEXT."
          git tag -a "v$NEXT" -m "v$NEXT"
          git push origin HEAD
          git push origin "v$NEXT"
