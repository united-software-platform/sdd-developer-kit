# Проверка объёма секций Makefile.
#
# Пайплайн — тонкая обёртка над tools/make-lint/check.sh: тот же вердикт доступен локально
# до отправки изменений. Проверка ничего не изменяет в репозитории.
#
# Отдельный пайплайн, а не шаг в чужом сценарии: здесь проверяется один файл рабочего дерева,
# и объединение с проверкой другого назначения сделало бы красный статус неразличимым —
# непонятно, что именно нарушено.
name: makefile-lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  makefile-lint:
    name: Секции Makefile в пределах лимита
    runs-on: ubuntu-latest

    steps:
      # История не нужна: проверка читает один файл текущего состояния.
      - name: Получение репозитория
        uses: actions/checkout@v4

      # Единственный шаг: проверка по норме — умолчанию скрипта, 30 строк на секцию. Ключ
      # --max-lines не передаётся, поэтому предел здесь не дублируется и не может разойтись
      # с умолчанием. Храповик по MAKE-005 достиг целевого значения: ослаблять предел нельзя,
      # а второй, информационный прогон больше не нужен — он давал бы тот же вердикт.
      - name: Проверка объёма секций Makefile
        run: sh tools/make-lint/check.sh
