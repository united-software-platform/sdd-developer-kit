# Проверка версии репозитория kit'а.
#
# Пайплайн — тонкая обёртка над tools/version/check.sh: тот же вердикт доступен локально
# до отправки изменений. Проверка ничего не публикует и не расставляет теги — этим занят
# отдельный сценарий release.yml, запускаемый вручную.
#
# Запуска по тегам здесь нет: тег создаёт тот же прогон релиза, что и коммит с новой версией,
# поэтому проверять их согласованность постфактум нечего.
name: version-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  version-check:
    name: Версия согласована с составом поставки
    runs-on: ubuntu-latest

    steps:
      # Полная история нужна ради базы сравнения: ею служит точка ветвления от целевой ветки.
      - name: Получение репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # База зависит от события: у pull_request это целевая ветка, у push — предыдущее
      # состояние ветки. При первом push в ветку предыдущего состояния нет (нулевой SHA),
      # и сравнивать не с чем — шаг завершается без проверки.
      - name: Проверка версии
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base=""
          else
            base="$PUSH_BEFORE"
          fi

          if [ -z "$base" ]; then
            echo "Базы сравнения нет — первый push в ветку; проверка пропущена."
            exit 0
          fi

          sh tools/version/check.sh --base "$base"
