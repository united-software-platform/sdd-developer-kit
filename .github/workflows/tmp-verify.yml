# ВРЕМЕННЫЙ сценарий проверки изменения keep-agent-image-fresh.
#
# Подтверждает то, что нельзя проверить без Docker: локальную сборку образа и форму ссылки
# на образ в поставляемой конфигурации. Живёт только в ветке проверки, в main не сливается
# и после снятия проверок удаляется вместе с веткой.
name: tmp-verify

on:
  pull_request:

env:
  KIT_IMAGE_REPO: united-software-platform/sdd-developer-kit

jobs:
  # Задача 1.1: значение ARG по умолчанию оставлено для локальной сборки — она не должна
  # зависеть от опроса реестра, а переданный выпуск обязан попадать в образ.
  dockerfile-default:
    name: Локальная сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка без аргументов
        run: |
          echo "== значение ARG по умолчанию =="
          sed -n 's/^ARG CLAUDE_VERSION=//p' Dockerfile
          docker build -t claude-openspec:local .
          echo "== выпуск Claude Code в образе локальной сборки =="
          docker run --rm claude-openspec:local claude --version

      - name: Сборка с переданным выпуском
        run: |
          docker build --build-arg CLAUDE_VERSION=2.1.281 -t claude-openspec:pinned .
          got=$(docker run --rm claude-openspec:pinned claude --version \
              | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          [ "$got" = "2.1.281" ] \
              || { echo "передан выпуск 2.1.281, а в образе $got" >&2; exit 1; }
          echo "передан выпуск 2.1.281 — в образе $got"

  # Задачи 7.2 и 7.3: ссылка на образ собирается из трёх переменных, и ни один из четырёх
  # способов адресации не требует правки поставляемой конфигурации.
  compose-reference:
    name: Форма ссылки на образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Значения по умолчанию
        run: |
          cp .env.example .env
          docker compose config | grep 'image:'
          docker compose run --rm claude id

      - name: Тег версии и тег состава
        run: |
          SDD_KIT_IMAGE_TAG=1.4.1 docker compose config | grep 'image:'
          SDD_KIT_IMAGE_TAG=1.4.1 docker compose run --rm claude claude --version
          SDD_KIT_IMAGE_TAG=1.4.1-20260925-120000 docker compose config | grep 'image:'

      - name: Адресация по digest
        run: |
          digest=$(sh .github/scripts/registry.sh digest "$KIT_IMAGE_REPO" latest)
          export SDD_KIT_IMAGE_DIGEST="@$digest"
          docker compose config | grep 'image:'
          docker compose run --rm claude id

      - name: Установка в чистый проект
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean && git init -q .
          sh "$GITHUB_WORKSPACE/install.sh" --source "$GITHUB_WORKSPACE" -y
          cp .env.example .env
          docker compose config | grep 'image:'
          docker compose run --rm claude openspec --version
