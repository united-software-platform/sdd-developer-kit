# Релиз версии репозитория SDD Developer Kit.
#
# Запускается только вручную: релиз — решение человека, а не следствие события репозитория.
# Ручной запуск с явно заданным разрядом и есть то явное решение, которого требует GIT-015;
# отдельных подтверждений внутри прогона поэтому нет. Разряд — единственный ввод: решение
# человека исчерпывается ответами «выпускать» и «какой разряд».
#
# Сообщение релизного коммита не несёт кода и номера задачи: без соответствующего ввода взять
# их неоткуда, а выводить из контекста запрещает GIT-010. Такой коммит описан в правилах Git
# как именованное исключение из формата GIT-009 — см. rules/git-rules.md, «Исключение для
# машинного релизного коммита».
#
# Один прогон делает всё разом: поднимает VERSION, коммитит, ставит аннотированный тег vX.Y.Z
# и публикует его. Отсюда согласованность носителей по построению — состояния, в котором тег
# указывает на коммит с другим номером, не возникает, и сторожить его проверкой не нужно.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Разряд версии
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Право на запись нужно ровно этому сценарию: он коммитит VERSION и публикует тег.
# Право на запуск пайплайнов — для сборки образа новой версии: без него диспетчеризация
# сценария образа невозможна. Других прав сценарию не требуется.
permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Повышение версии и публикация тега
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4

      # Входное значение передаётся через env, а не подставляется в текст команды: подстановка
      # выражения ${{ }} прямо в скрипт склеивает данные с кодом, и ввод запускающего оказался бы
      # исполняемым.
      #
      # Значение читается строго как МАЖОР.МИНОР.ПАТЧ: молчаливое додумывание неполного номера
      # дало бы тег, не совпадающий с содержимым файла.
      - name: Разбор текущей версии
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(head -n 1 VERSION | tr -d ' \011\015\012')
          printf '%s\n' "$current" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "VERSION не разбирается как МАЖОР.МИНОР.ПАТЧ: прочитано «$current»" >&2; exit 1; }
          major=${current%%.*}; rest=${current#*.}; minor=${rest%%.*}; patch=${rest#*.}
          case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "$current -> $major.$minor.$patch"

      # Гейт GIT-020: новая версия не пишется поверх незафиксированной работы.
      - name: Гейт незакоммиченных правок
        run: |
          pending=$(git status --porcelain -- VERSION)
          [ -z "$pending" ] || { echo "В VERSION есть незакоммиченные правки:" >&2
                                 echo "$pending" >&2; exit 1; }

      - name: Запись версии, коммит и тег
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          printf '%s\n' "$NEXT" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Релиз v$NEXT" -m "Версия повышена: $CURRENT -> $NEXT."
          git tag -a "v$NEXT" -m "v$NEXT"
          git push origin HEAD
          git push origin "v$NEXT"

      # Push релизного коммита сборку образа не запускает: событие, порождённое встроенным токеном
      # рабочего процесса, новых прогонов не создаёт — исключение сделано только для ручного запуска
      # и repository_dispatch. Путь VERSION в фильтре сценария образа описывает связь, которой для
      # релиза нет, поэтому сборка запускается отсюда явно.
      #
      # Шаг стоит после публикации коммита и тега: прогон стартует на вершине main, и до появления
      # там релизного коммита он прочитал бы прежний VERSION и переопубликовал бы прежний тег.
      #
      # Ссылка запуска — main, а не тег vX.Y.Z: тег latest сценарий образа проставляет только при
      # запуске из основной ветки, и запуск по тегу оставил бы без новой версии все проекты,
      # где тег образа не закреплён.
      #
      # Завершения прогона релиз не ждёт: сборка arm64 идёт через эмуляцию и занимает десятки минут.
      # Неуспех самой сборки релиз не красит — он виден по отсутствию тега версии в реестре и по
      # прогону сценария образа. Неуспех же этого вызова — нехватка прав, недоступность API — обязан
      # красить релиз, поэтому continue-on-error здесь не ставится.
      - name: Запуск сборки образа новой версии
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-agent.yml --ref main
