# Проверка объёма секций Makefile.
#
# Пайплайн — тонкая обёртка над tools/make-lint/check.sh: тот же вердикт доступен локально
# до отправки изменений. Проверка ничего не изменяет в репозитории.
#
# Отдельный пайплайн, а не шаг version-check: тому нужна полная история (fetch-depth: 0)
# и запуск по тегам, а здесь проверяется один файл рабочего дерева. Объединение сделало бы
# красный статус неразличимым — непонятно, что именно нарушено.
name: makefile-lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  makefile-lint:
    name: Секции Makefile в пределах лимита
    runs-on: ubuntu-latest

    steps:
      # История не нужна: проверка читает один файл текущего состояния.
      - name: Получение репозитория
        uses: actions/checkout@v4

      # Блокирующий шаг. Предел 61 — не норма, а текущий долг: столько занимает самая крупная
      # секция файла, init-host. Норма — 30 строк, умолчание скрипта; она проверяется следующим
      # шагом. Храповик по MAKE-005: значение 61 не увеличивается ни при какой правке и снижается
      # по мере устранения превышений. Когда init-host разбит, ключ --max-lines отсюда убирается,
      # информационный шаг удаляется, и оба прогона схлопываются в один.
      - name: Проверка объёма секций Makefile
        run: sh tools/make-lint/check.sh --max-lines 61

      # Информационный шаг: тот же скрипт по норме (умолчание 30 строк). Не блокирует слияние,
      # пока блокирующий предел выше нормы, — иначе main был бы красным из-за долга, устранение
      # которого вынесено в отдельную задачу. Смысл шага в том, что перечень секций-должников
      # печатается в каждом прогоне: долг виден количественно и не становится незаметным.
      #
      # Ошибку окружения (код 2) этот шаг тоже пропустил бы, но блокирующий шаг выполняет тот же
      # скрипт на том же файле раньше — до сюда пайплайн в таком случае не доходит.
      - name: Норма 30 строк (информационно)
        continue-on-error: true
        run: sh tools/make-lint/check.sh
