# Проверка ссылочной целостности документации.
#
# Пайплайн — тонкая обёртка над tools/docs-lint/check.sh: тот же вердикт доступен локально
# до отправки изменений. Проверка ничего не изменяет в репозитории.
#
# Отдельный пайплайн, а не шаг в чужом сценарии: здесь проверяется документация репозитория,
# и объединение с проверкой другого назначения сделало бы красный статус неразличимым —
# непонятно, что именно нарушено.
name: docs-lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-lint:
    name: Ссылки и коды правил разрешаются
    runs-on: ubuntu-latest

    steps:
      # История не нужна: проверка читает текущее состояние рабочего дерева.
      - name: Получение репозитория
        uses: actions/checkout@v4

      # Единственный шаг: скрипт вызывается без ключей, поэтому вердикт пайплайна и локального
      # прогона на одном и том же состоянии файлов совпадает по построению.
      - name: Проверка ссылочной целостности документации
        run: sh tools/docs-lint/check.sh
